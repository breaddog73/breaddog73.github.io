<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>만두가게 - 기억력 게임</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🥟 만두가게 🥟</h1>
            <p class="subtitle">짝을 맞춰서 만두를 팔아보세요!</p>
        </header>

        <div class="game-info">
            <div class="info-item">
                <span class="label">라운드:</span>
                <span class="value" id="round">1</span>
            </div>
            <div class="info-item">
                <span class="label">판매:</span>
                <span class="value" id="sold">0</span>/<span id="target">8</span>
            </div>
            <div class="info-item">
                <span class="label">남은 시간:</span>
                <span class="value" id="timer">-</span>
            </div>
        </div>

        <div class="game-status" id="gameStatus"></div>

        <div class="game-board" id="gameBoard"></div>

        <div class="buttons">
            <button class="btn btn-primary" id="startBtn" onclick="startGame()">게임 시작</button>
            <button class="btn btn-secondary" id="nextBtn" onclick="nextRound()" style="display: none;">다음 라운드</button>
            <button class="btn btn-secondary" id="retryBtn" onclick="retryRound()" style="display: none;">다시 시도</button>
        </div>

        <div class="game-tips">
            <h3>게임 설명</h3>
            <ul>
                <li>게임 시작 후 3초 동안 모든 카드가 보여집니다</li>
                <li>3초 후 카드가 뒤집혀집니다 (만두찜기 뚜껑이 닫힙니다)</li>
                <li>같은 만두 짝을 찾아서 클릭하세요</li>
                <li>짝을 맞추면 그 만두를 판매할 수 있습니다</li>
                <li>라운드 목표량 이상을 팔면 라운드를 클리어합니다</li>
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
